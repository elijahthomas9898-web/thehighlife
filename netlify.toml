[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────
#  Headers are NOT set here.
#
#  Netlify's [[headers]] rules don't reliably reach Next.js server-rendered
#  pages — checked against a live deploy and X-Robots-Tag / X-Frame-Options
#  were silently missing. They now live in next.config.ts, which Next applies
#  to its own responses.
#
#  Launch day: set SITE_PUBLIC=true in Netlify's environment variables.
#  Nothing in this file needs changing.
# ─────────────────────────────────────────────────────────────────────────
