[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────
#  ⚠️ PREVIEW MODE — blocks Google from indexing the site.
#
#  While we're testing, we do NOT want a half-finished cannabis site showing
#  up in search results, or competing with thehighlifeny.com.
#
#  ✏️ DELETE this whole [[headers]] block on launch day, when the site is
#     ready to be found publicly.
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ─────────────────────────────────────────────────────────────────────────
#  Security headers — keep these on launch day.
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # don't let other sites frame the age gate away
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # this site needs none of these
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
